# Required metadata to identify the project in SonarQube
sonar.projectKey=sonar-project            # Replace with your SonarQube project key
sonar.projectName=sonar-project          # Replace with your project name
sonar.projectVersion=1.0                   # Replace with your project version

# Define the sources for the analysis
sonar.sources=src                         # Specify the source folder (replace 'src' if necessary)

# Define the language of the project (optional, SonarQube usually detects this automatically)
sonar.language=js                         # For JavaScript/Node.js projects

# Set the encoding for your project files
sonar.sourceEncoding=UTF-8                 # Default encoding is UTF-8, but change if needed

# Optional: To include test files in the analysis (if you have tests)
sonar.tests=tests                          # Adjust the path to your test files

# Optional: Set up exclusions (e.g., to exclude test or build folders)
sonar.exclusions=**/node_modules/**,**/*.test.js   # Example of excluding node_modules and test files

# Optional: If using a custom rule set (e.g., ESLint for Node.js)
sonar.javascript.lcov.reportPaths=coverage/lcov-report/index-lcov-report.json  # Example for code coverage

# Optional: If you're using TypeScript (for TypeScript projects)
# sonar.typescript.tsconfigPath=tsconfig.json
