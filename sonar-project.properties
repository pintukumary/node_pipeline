# Required metadata to identify the project in SonarQube
sonar.projectKey=sonar-project           # Replace with your unique SonarQube project key
sonar.projectName=sonar-project          # Replace with your project name
sonar.projectVersion=2.11               # Version of your project

# Define the sources for the analysis
# Point this to your current directory
sonar.sources=.

# Set the encoding for your project files
sonar.sourceEncoding=UTF-8               # Default encoding is UTF-8, adjust if needed

# Optional: Set up exclusions (e.g., exclude unnecessary files like SQL files, etc.)
sonar.exclusions=**/*.sql,**/*.exe        # Exclude .sql and .exe files if they exist in the project

# Optional: If you want to include any test files, you can set the path here.
# For example, if you have tests, you might add:
# sonar.tests=tests
# sonar.test.inclusions=**/*.js,**/*.ts   # Example of including test files (adjust as needed)
